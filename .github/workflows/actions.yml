on:
  push:
    paths-ignore:
      - "docs/**"
      - "README.rst"
      - "CHANGELOG.md"
      - "CONTRIBUTING.rst"
      - ".github/workflows/docs.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.rst"
      - "CHANGELOG.md"
      - "CONTRIBUTING.rst"
      - ".github/workflows/docs.yml"
      - ".github/workflows/pages.yml"
name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Both dimensions belong in the matrix itself. Listing the server
        # versions under `include` made each entry overwrite the one before it
        # for every Python version, so only the last one ever ran and the other
        # three were advertised without being tested. The `include` entries
        # below add the registry each version lives under: they name a version
        # the matrix already has, so they match those combinations rather than
        # replacing them.
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
        clickhouse-version:
          - 18.14.9
          - 19.3.5
          - 22.5.1.2079
          - 23.8.4.69
        include:
          - clickhouse-version: 18.14.9
            clickhouse-org: yandex
          - clickhouse-version: 19.3.5
            clickhouse-org: yandex
          - clickhouse-version: 22.5.1.2079
            clickhouse-org: clickhouse
          - clickhouse-version: 23.8.4.69
            clickhouse-org: clickhouse
    services:
      clickhouse-server:
        image: ${{ matrix.clickhouse-org }}/clickhouse-server:${{ matrix.clickhouse-version }}
        ports:
          - 8123:8123
          - 9000:9000

    name: ${{ matrix.python-version }} CH=${{ matrix.clickhouse-version }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install test requirements
        run: |
          pip install --upgrade pip
          pip install pdm
          pdm install -G test -G lint -G coverage
      - name: Run prek
        run: pdm run prek-all
      - name: Run tests
        run: pdm run coverage --timeout=10 -v
        timeout-minutes: 2
